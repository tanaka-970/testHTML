<svg xmlns="http://www.w3.org/2000/svg" width="1260" height="220" viewBox="0 0 1260 220" role="img" aria-labelledby="title desc">
  <title id="title">Particle Emitter fixed module pipeline</title>
  <desc id="desc">Emitter, Spawn, Update, Water, Appearance, Renderer in a fixed sequence.</desc>
  <rect width="1260" height="220" rx="18" fill="#101722"/>
  <g font-family="Segoe UI, sans-serif" text-anchor="middle">
    <g fill="none" stroke="#50cdec" stroke-width="5"><path d="M192 108h29m-10-10 10 10-10 10"/><path d="M399 108h29m-10-10 10 10-10 10"/><path d="M606 108h29m-10-10 10 10-10 10"/><path d="M813 108h29m-10-10 10 10-10 10"/><path d="M1020 108h29m-10-10 10 10-10 10"/></g>
    <g fill="#202d40" stroke="#56dfff" stroke-width="2">
      <rect x="20" y="58" width="172" height="100" rx="12"/><rect x="227" y="58" width="172" height="100" rx="12"/><rect x="434" y="58" width="172" height="100" rx="12"/><rect x="641" y="58" width="172" height="100" rx="12"/><rect x="848" y="58" width="172" height="100" rx="12"/><rect x="1055" y="58" width="185" height="100" rx="12"/>
    </g>
    <g fill="#f5f8ff" font-size="22" font-weight="700"><text x="106" y="99">Emitter</text><text x="313" y="99">Spawn</text><text x="520" y="99">Update</text><text x="727" y="99">Water</text><text x="934" y="99">Appearance</text><text x="1147" y="99">Renderer</text></g>
    <g fill="#b1c3d3" font-size="14"><text x="106" y="128">position / limit</text><text x="313" y="128">shape / rate / speed</text><text x="520" y="128">forces / turbulence</text><text x="727" y="128">reflection / impact</text><text x="934" y="128">color / size / curves</text><text x="1147" y="128">sprite / blend</text></g>
    <text x="630" y="196" fill="#ffcf68" font-size="14">fixed order · select a node to change the displayed settings · arbitrary rewiring is not available</text>
  </g>
</svg>
